<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Management - Paw Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#22C55E',
                        secondary: '#86EFAC'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="index.html" class="text-2xl font-['Pacifico'] text-gray-800">Paw Portal</a>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="admin-dashboard.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="#" class="border-primary text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Pet Management
                        </a>
                        <a href="admin-adoptions.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Adoptions
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-red-600">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Page Header -->
        <div class="md:flex md:items-center md:justify-between mb-8">
            <div class="flex-1 min-w-0">
                <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                    Pet Management
                </h2>
            </div>
            <div class="mt-4 flex md:mt-0 md:ml-4">
                <button id="addPetBtn" class="ml-3 inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none">
                    <i class="ri-add-line mr-2"></i>
                    Add New Pet
                </button>
            </div>
        </div>

        <!-- Add Pet Modal -->
        <div id="addPetModal" class="fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center hidden">
            <div class="bg-white rounded-lg p-6 max-w-md w-full">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-medium text-gray-900">Add New Pet</h3>
                    <button onclick="closeAddPetModal()" class="text-gray-400 hover:text-gray-500">
                        <i class="ri-close-line text-2xl"></i>
                    </button>
                </div>
                <form id="addPetForm" class="space-y-4">
                    <div>
                        <label for="petName" class="block text-sm font-medium text-gray-700">Pet Name</label>
                        <input type="text" id="petName" name="name" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label for="petBreed" class="block text-sm font-medium text-gray-700">Breed</label>
                        <input type="text" id="petBreed" name="breed" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label for="petAge" class="block text-sm font-medium text-gray-700">Age</label>
                        <input type="text" id="petAge" name="age" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label for="petType" class="block text-sm font-medium text-gray-700">Type</label>
                        <select id="petType" name="type" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary">
                            <option value="">Select type</option>
                            <option value="Dog">Dog</option>
                            <option value="Cat">Cat</option>
                            <option value="Bird">Bird</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="petDescription" class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="petDescription" name="description" rows="3" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary"></textarea>
                    </div>
                    <div>
                        <label for="petImage" class="block text-sm font-medium text-gray-700">Image URL</label>
                        <input type="url" id="petImage" name="imageUrl" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary">
                    </div>
                    <div class="flex justify-end space-x-3 mt-6">
                        <button type="button" onclick="closeAddPetModal()"
                            class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
                            Cancel
                        </button>
                        <button type="submit"
                            class="bg-primary py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-primary/90 focus:outline-none">
                            Add Pet
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Pet List -->
        <div class="bg-white shadow overflow-hidden sm:rounded-md">
            <ul id="petList" class="divide-y divide-gray-200">
                <!-- Pet items will be inserted here -->
            </ul>
        </div>
    </main>

    <!-- Notification Component -->
    <div id="notification" class="fixed top-4 right-4 bg-white p-4 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 flex items-center z-50">
        <i class="ri-information-line mr-2 text-primary"></i>
        <span id="notificationText"></span>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA3F3X1WWgIP9rxFiroRqPKUE6PzQ5wYxw",
            authDomain: "paw-portal.firebaseapp.com",
            projectId: "paw-portal",
            storageBucket: "paw-portal.appspot.com",
            messagingSenderId: "1092693026291",
            appId: "1:1092693026291:web:e345189aa9a3a7439f9e86",
            measurementId: "G-TCF2MRJRTY"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Show notification function
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            if (notification && notificationText) {
                notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg transform transition-transform duration-300 z-50 ${
                    type === 'error' ? 'bg-red-500 text-white' : 'bg-white'
                }`;
                notificationText.textContent = message;
                notification.classList.remove('translate-x-full');
                setTimeout(() => {
                    notification.classList.add('translate-x-full');
                }, 5000);
            }
        }

        // Load pets from Firestore
        async function loadPets() {
            try {
                const petList = document.getElementById('petList');
                petList.innerHTML = '<div class="p-4 text-center text-gray-500">Loading pets...</div>';

                const snapshot = await db.collection('pets').orderBy('timestamp', 'desc').get();
                const pets = [];
                snapshot.forEach(doc => {
                    pets.push({ id: doc.id, ...doc.data() });
                });

                if (pets.length === 0) {
                    petList.innerHTML = '<div class="p-4 text-center text-gray-500">No pets found. Add some pets to get started.</div>';
                    return;
                }

                petList.innerHTML = '';
                pets.forEach(pet => {
                    const li = document.createElement('li');
                    li.className = 'hover:bg-gray-50';
                    li.innerHTML = `
                        <div class="px-6 py-4 flex items-center">
                            <div class="flex-shrink-0 h-16 w-16 rounded-lg overflow-hidden">
                                <img src="${pet.imageUrl || 'https://via.placeholder.com/150'}" alt="${pet.name}" class="h-full w-full object-cover">
                            </div>
                            <div class="ml-4 flex-1">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">${pet.name || 'Unnamed Pet'}</p>
                                        <p class="text-sm text-gray-500">${pet.breed || 'Unknown breed'} • ${pet.age || 'Age unknown'}</p>
                                        <p class="text-sm text-gray-500">${pet.type || 'Unknown type'}</p>
                                    </div>
                                    <div class="flex items-center space-x-4">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                                            pet.status === 'available' ? 'bg-green-100 text-green-800' : 
                                            pet.status === 'adopted' ? 'bg-blue-100 text-blue-800' : 
                                            'bg-yellow-100 text-yellow-800'
                                        }">
                                            ${pet.status || 'unknown'}
                                        </span>
                                        <button onclick="deletePet('${pet.id}')" class="text-red-600 hover:text-red-900">
                                            <i class="ri-delete-bin-line"></i>
                                        </button>
                                    </div>
                                </div>
                                <p class="mt-1 text-sm text-gray-500 line-clamp-2">${pet.description || 'No description available'}</p>
                            </div>
                        </div>
                    `;
                    petList.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading pets:', error);
                showNotification('Error loading pets: ' + error.message, 'error');
            }
        }

        // Delete pet function
        async function deletePet(petId) {
            if (!confirm('Are you sure you want to delete this pet?')) return;

            try {
                await db.collection('pets').doc(petId).delete();
                showNotification('Pet deleted successfully');
                loadPets();
            } catch (error) {
                console.error('Error deleting pet:', error);
                showNotification('Error deleting pet: ' + error.message, 'error');
            }
        }

        // Remove the old import related code and add new pet management functions
        function openAddPetModal() {
            document.getElementById('addPetModal').classList.remove('hidden');
        }

        function closeAddPetModal() {
            document.getElementById('addPetModal').classList.add('hidden');
            document.getElementById('addPetForm').reset();
        }

        // Add event listeners
        document.getElementById('addPetBtn').addEventListener('click', openAddPetModal);

        document.getElementById('addPetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const formData = {
                    name: document.getElementById('petName').value,
                    breed: document.getElementById('petBreed').value,
                    age: document.getElementById('petAge').value,
                    type: document.getElementById('petType').value,
                    description: document.getElementById('petDescription').value,
                    imageUrl: document.getElementById('petImage').value,
                    status: 'available',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('pets').add(formData);
                showNotification('Pet added successfully!');
                closeAddPetModal();
                loadPets();
            } catch (error) {
                console.error('Error adding pet:', error);
                showNotification('Error adding pet: ' + error.message, 'error');
            }
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => {
                localStorage.clear();
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error('Error signing out:', error);
                showNotification('Error signing out: ' + error.message, 'error');
            });
        });

        // Check authentication
        auth.onAuthStateChanged((user) => {
            if (!user || user.email !== '23dcs023@charusat.edu.in') {
                window.location.href = 'login.html';
                return;
            }
            loadPets();
        });
    </script>
</body>
</html>
