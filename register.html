<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paw Portal - Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: '#22C55E',
secondary: '#86EFAC'
},
borderRadius: {
'none': '0px',
'sm': '4px',
DEFAULT: '8px',
'md': '12px',

'xl': '20px',
'2xl': '24px',
'3xl': '32px',
'full': '9999px',
'button': '8px'
}
}
}
}
</script>
<style>
:where([class^="ri-"])::before { content: "\f3c2"; }
.toggle-password { cursor: pointer; }
</style>
</head>
<body class="min-h-screen">
<!-- Add notification div at the start of body -->
<div id="notification" class="fixed top-4 right-4 bg-white p-4 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 flex items-center z-50">
    <i class="ri-error-warning-line text-primary mr-2"></i>
    <span id="notificationText"></span>
</div>

<div class="flex min-h-screen">
<div class="w-1/2 bg-white p-8 flex flex-col relative overflow-hidden">
<div class="font-['Pacifico'] text-5xl text-gray-800 relative z-10">Paw Portal</div>
<div class="absolute inset-0">
<img src="https://public.readdy.ai/ai/img_res/17e7c0a802a2f74e7c1fac07806e94d6.jpg"
alt="Pet adoption illustration"
class="w-full h-full object-cover object-top">
</div>
</div>
<div class="w-1/2 bg-green-50 p-12 flex flex-col justify-center">
<div class="max-w-md mx-auto w-full bg-white rounded-xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.7)] p-8 transform hover:scale-[1.01] transition-all duration-300">
<h1 class="text-3xl font-bold text-gray-900 mb-2">Create an account</h1>
<p class="text-gray-600 mb-8">Join our community of pet lovers</p>
<form id="signupForm" class="space-y-4">
<div>
<div class="relative">
<i class="ri-user-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
<input type="text" id="nameInput" placeholder="Enter your name" class="w-full pl-10 pr-4 py-3 border border-gray-900 rounded focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
</div>
</div>
<div>
<div class="relative">
<i class="ri-mail-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
<input type="email" id="emailInput" placeholder="Enter your email" class="w-full pl-10 pr-4 py-3 border border-gray-900 rounded focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
<p id="emailError" class="text-red-500 text-sm mt-1 hidden">Please enter a valid email address</p>
</div>
</div>
<div>
<div class="relative">
<i class="ri-phone-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
<input type="tel" placeholder="Enter your phone number" class="w-full pl-10 pr-4 py-3 border border-gray-900 rounded focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
</div>
</div>
<div>
<div class="relative">
<i class="ri-lock-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
<input type="password" id="password" placeholder="Create a password" class="w-full pl-10 pr-12 py-3 border border-gray-900 rounded focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
<i class="ri-eye-line toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
</div>
</div>
<div class="flex gap-8">
<label class="flex items-center gap-2">
<input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary">
<span class="text-gray-600">Remember me</span>
</label>
<label class="flex items-center gap-2">
<input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary">
<span class="text-gray-600">Receive event emails</span>
</label>
</div>
<button type="submit" class="w-full bg-gray-900 text-white py-3 rounded-button hover:bg-gray-800 transition-colors">
Sign Up
</button>
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-green-50 text-gray-500">Or continue with</span>
</div>
</div>
<button type="button" id="googleSignUp" class="w-full flex items-center justify-center gap-2 border border-gray-900 bg-white py-3 rounded-button hover:bg-gray-50 transition-colors">
<i class="ri-google-fill text-[#4285f4]"></i>
<span>Sign up with Google</span>
</button>
</div>
</form>
<div class="text-center mt-6">
<p class="text-gray-600">Already have an account? <a href="login.html" class="text-primary hover:text-primary/80 font-medium">Sign in</a></p>
</div>
</div>
</div>

<!-- Firebase scripts -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
// Initialize Firebase immediately
const firebaseConfig = {
    apiKey: "AIzaSyA3F3X1WWgIP9rxFiroRqPKUE6PzQ5wYxw",
    authDomain: "paw-portal.firebaseapp.com",
    projectId: "paw-portal",
    storageBucket: "paw-portal.appspot.com",
    messagingSenderId: "1092693026291",
    appId: "1:1092693026291:web:e345189aa9a3a7439f9e86",
    measurementId: "G-TCF2MRJRTY"
};

// Initialize Firebase
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

// Form submission handler
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    try {
        // Get form values
        const name = document.getElementById('nameInput').value;
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('password').value;
        const phone = document.querySelector('input[type="tel"]').value;
        
        // Create user with email and password
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Update user profile
        await user.updateProfile({
            displayName: name
        });
        
        // Create user document in Firestore
        await db.collection('users').doc(user.uid).set({
            name: name,
            email: email,
            phone: phone,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Set login state
        localStorage.setItem('userLoggedIn', 'true');
        
        // Show success notification
        showNotification('Registration successful! Redirecting to home page...');
        
        // Redirect to home page after a short delay
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
        
    } catch (error) {
        console.error('Registration error:', error);
        showNotification(error.message);
    }
});

// Google Sign Up Handler
async function handleGoogleSignUp() {
    try {
        showNotification('Initializing Google sign-up...');
        
        // Create Google Auth Provider with all necessary scopes
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/userinfo.email');
        provider.addScope('https://www.googleapis.com/auth/userinfo.profile');
        
        // Set custom parameters for Google Sign In
        provider.setCustomParameters({
            prompt: 'select_account',
            auth_type: 'signup'
        });

        // Clear any existing auth state
        await firebase.auth().signOut();
        
        console.log('Attempting Google sign-up...');
        const result = await firebase.auth().signInWithPopup(provider);
        console.log('Sign-up result:', result);
        
        const user = result.user;
        if (!user) throw new Error('No user data available');

        console.log('User signed up:', user.email);

        // Create user document in Firestore
        try {
            await db.collection('users').doc(user.uid).set({
                name: user.displayName,
                email: user.email,
                photoURL: user.photoURL,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                profileCompleted: false
            }, { merge: true });
            console.log('User document created in Firestore');
        } catch (firestoreError) {
            console.error('Firestore error:', firestoreError);
            // Continue even if Firestore fails - we can update profile later
        }

        // Set session data
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('needsProfileCompletion', 'true');
        
        showNotification('Sign up successful! Redirecting to profile completion...');
        
        // Redirect to profile completion
        setTimeout(() => {
            window.location.href = 'profile-completion.html';
        }, 1500);

    } catch (error) {
        console.error('Google Sign Up Error:', error);
        console.error('Error code:', error.code);
        console.error('Error message:', error.message);
        
        let message = 'Error signing up with Google';
        
        switch(error.code) {
            case 'auth/popup-blocked':
                message = 'Please allow popups for this website and try again';
                break;
            case 'auth/popup-closed-by-user':
                message = 'Sign up cancelled - please try again';
                break;
            case 'auth/unauthorized-domain':
                message = 'Please access from an authorized domain. If local, use localhost:5500';
                break;
            case 'auth/insufficient-permission':
                message = 'Please ensure you are using a valid Google account and try again';
                break;
            case 'auth/internal-error':
                message = 'Server error. Please try again later';
                break;
            case 'auth/network-request-failed':
                message = 'Network error. Please check your connection and try again';
                break;
            default:
                message = error.message || 'Error signing up with Google';
        }
        
        showNotification(message);
    }
}

// Attach click handler after DOM loads
document.addEventListener('DOMContentLoaded', function() {
    // Remove profile button from register page
    const profileButton = document.getElementById('profileButton');
    if (profileButton) {
        profileButton.remove();
    }

    const googleSignUpBtn = document.getElementById('googleSignUp');
    if (googleSignUpBtn) {
        googleSignUpBtn.onclick = function(e) {
            e.preventDefault();
            handleGoogleSignUp();
        };
    }
});

function showNotification(message) {
    const notification = document.getElementById('notification');
    if (!notification) return;
    
    const notificationText = document.getElementById('notificationText');
    if (notificationText) {
        notificationText.textContent = message;
    }
    
    notification.classList.remove('translate-x-full');
    setTimeout(() => {
        notification.classList.add('translate-x-full');
    }, 5000); // Show for 5 seconds instead of 3
}
</script>

<div id="profileCompletionModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4">
        <h2 class="text-2xl font-bold mb-4">Complete Your Profile</h2>
        <p class="text-gray-600 mb-6">Please provide additional information to complete your registration.</p>
        <form id="profileCompletionForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-2">Phone Number</label>
                <div class="relative">
                    <i class="ri-phone-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="tel" id="phoneNumber" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 mb-2">Role</label>
                <div class="relative">
                    <select id="userRole" required
                        class="w-full pl-4 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none">
                        <option value="">Select role</option>
                        <option value="ngo">NGO</option>
                        <option value="foster">Foster Care</option>
                        <option value="member">Member</option>
                    </select>
                    <i class="ri-arrow-down-s-line absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>
            <div id="ngoFields" class="hidden">
                <label class="block text-gray-700 mb-2">Company Name</label>
                <div class="relative">
                    <i class="ri-building-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="companyName"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                </div>
            </div>
            <div id="fosterFields" class="hidden">
                <label class="block text-gray-700 mb-2">Foster Care Name</label>
                <div class="relative">
                    <i class="ri-home-heart-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="fosterName"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                </div>
            </div>
            <button type="submit"
                class="w-full bg-primary text-white py-3 rounded-lg hover:bg-primary/90 transition-colors">
                Complete Profile
            </button>
        </form>
    </div>
</div>
</body>
</html>
