<!DOCTYPE html>
<html>
<head>
    <title>Update Pet Status</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
    <h1>Updating PP002 Status...</h1>
    <div id="status"></div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA3F3X1WWgIP9rxFiroRqPKUE6PzQ5wYxw",
            authDomain: "paw-portal.firebaseapp.com",
            projectId: "paw-portal",
            storageBucket: "paw-portal.appspot.com",
            messagingSenderId: "1092693026291",
            appId: "1:1092693026291:web:e345189aa9a3a7439f9e86",
            measurementId: "G-TCF2MRJRTY"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Function to update pet status
        async function updatePetStatus() {
            try {
                const statusDiv = document.getElementById('status');
                statusDiv.textContent = 'Authenticating...';

                // Sign in as admin
                await auth.signInWithEmailAndPassword('23dcs023@charusat.edu.in', 'admin123');
                statusDiv.textContent = 'Authenticated. Updating status...';

                // Get reference to PP002
                const petsRef = db.collection('pets');
                const snapshot = await petsRef.where('id', '==', 'PP002').get();

                if (snapshot.empty) {
                    statusDiv.textContent = 'Error: Pet PP002 not found';
                    return;
                }

                // Update the status
                const petDoc = snapshot.docs[0];
                await petDoc.ref.update({
                    status: 'available'
                });

                statusDiv.textContent = 'Success! PP002 status updated to available';
                
                // Redirect to adoptions page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'adoptions.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').textContent = 'Error: ' + error.message;
            }
        }

        // Run the update
        updatePetStatus();
    </script>
</body>
</html>
